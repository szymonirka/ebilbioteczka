<!DOCTYPE html>
<html lang="pl">
<head>
  <link rel="stylesheet" href="css/admin_style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administratora</title>
</head>
<body>
<header id="navbar">
  <div class="nav-left">
    <h1><a href="index.html">📚 eBiblioteczka</a></h1>
  </div>
  <nav class="nav-links">
    <div id="admin_status"></div>
    <div id="logout_button"></div>
  </nav>
</header>

<main class="admin-container">
  <section id="admin_books_management" class="admin-section">
    <div class="section-header">
      <h2><i class="icon-book"></i> Zarządzanie książkami</h2>
    </div>

    <div class="section-content">
      <div class="form-container">
        <h3>Dodaj nową książkę</h3>
        <form id="addBookForm" enctype="multipart/form-data" class="modern-form">
          <div class="form-group">
            <input type="text" name="title" id="book_title" placeholder=" " required>
            <label for="book_title">Tytuł książki</label>
          </div>

          <div class="form-group">
            <input type="text" name="author" id="book_author" placeholder=" " required>
            <label for="book_author">Autor</label>
          </div>

          <div class="form-group select-group">
            <select id="book_category" name="category" required>
              <option value=""></option>
              <option>Fantasy</option>
              <option>Science Fiction</option>
              <option>Romans</option>
              <option>Kryminał</option>
              <option>Thriller</option>
              <option>Horror</option>
              <option>Literatura piękna</option>
              <option>Literatura faktu</option>
              <option>Literatura polska</option>
              <option>Biografia</option>
              <option>Autobiografia</option>
              <option>Poezja</option>
              <option>Esej</option>
              <option>Reportaż</option>
              <option>Dramat</option>
              <option>Komiks</option>
              <option>Dla dzieci</option>
              <option>Dla młodzieży</option>
              <option>Przygodowa</option>
              <option>Historyczna</option>
              <option>Religijna</option>
              <option>Filozofia</option>
              <option>Psychologia</option>
              <option>Nauka i technika</option>
              <option>Biznes i ekonomia</option>
              <option>Poradnik</option>
              <option>Podróżnicza</option>
              <option>Kulinaria</option>
              <option>Sztuka</option>
              <option>Medycyna</option>
              <option>Informatyka</option>
              <option>Utopia</option>
              <option>Dystopia</option>
            </select>
            <label for="book_category">Kategoria</label>
            <div class="select-arrow"></div>
          </div>

          <div class="form-group textarea-group">
            <textarea name="content" id="book_content" placeholder=" "></textarea>
            <label for="book_content">Opis książki</label>
          </div>

          <div class="form-group file-group">
            <label for="book_pdf" class="file-label">
              <span class="file-button">Wybierz plik PDF</span>
              <span id="file-name">Nie wybrano pliku</span>
            </label>
            <input type="file" name="pdf" id="book_pdf" accept="application/pdf">
          </div>
            <br>
          <button type="submit" class="btn primary-btn">
            <i class="icon-add"></i> Dodaj książkę
          </button>
        </form>
      </div>

      <div class="list-container">
        <h3>Istniejące książki</h3>
        <div class="card-list" id="book_list"></div>
      </div>
    </div>
  </section>

  <section id="admin_user_management" class="admin-section">
    <div class="section-header">
      <h2><i class="icon-users"></i> Zarządzanie użytkownikami</h2>
    </div>

    <div class="section-content">
      <div class="form-container">
        <h3>Dodaj nowego użytkownika</h3>
        <form class="modern-form" id="addUserForm">
          <div class="form-group">
            <input type="text" id="new_user_username" placeholder=" " required>
            <label for="new_user_username">Nazwa użytkownika</label>
          </div>

          <div class="form-group">
            <input type="password" id="new_user_password" placeholder=" " required>
            <label for="new_user_password">Hasło</label>
          </div>

          <div class="form-group">
            <input type="password" id="new_user_confirm_password" placeholder=" " required>
            <label for="new_user_confirm_password">Potwierdź hasło</label>
          </div>

          <div class="form-group select-group">
            <select id="new_user_role">
              <option value="user">Użytkownik</option>
              <option value="admin">Administrator</option>
            </select>
            <label for="new_user_role">Rola</label>
            <div class="select-arrow"></div>
          </div>

          <button type="button" onclick="createUser()" class="btn primary-btn">
            <i class="icon-add-user"></i> Dodaj użytkownika
          </button>
        </form>
      </div>

      <div class="list-container">
        <h3>Istniejący użytkownicy</h3>
        <div class="card-list" id="user_list"></div>
      </div>
    </div>
  </section>
</main>

<footer class="admin-footer">
  <a href="index.html" class="back-link">
    <i class="icon-arrow-back"></i> Powrót do strony głównej
  </a>
</footer>
<script>
  const token = localStorage.getItem('token');
  const headers = {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + token
  };

  // Sprawdź rolę
  function checkAdmin() {
    if (!token) {
      alert("Brak dostępu – zaloguj się jako administrator.");
      window.location.href = "index.html";
      return;
    }

    const payload = JSON.parse(atob(token.split('.')[1]));
    if (payload.role !== 'admin') {
      alert("Dostęp tylko dla administratorów.");
      window.location.href = "index.html";
    } else {
      document.getElementById('admin_status').textContent = `Zalogowany jako: ${payload.username} (admin)`;
    }
  }

  // Książki
  async function loadBooks() {
    const res = await fetch('/api/admin/books/', {
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('token')
      }
    });
    const books = await res.json();
    const list = document.getElementById('book_list');
    list.innerHTML = '';

    books.forEach(book => {
      const li = document.createElement('li');
      li.innerHTML = `
        <strong>${book.title}</strong> – ${book.author}
        <button id="delete_button" onclick="deleteBook(${book.id})">🗑️ Usuń</button>
        <button id="edit_button" onclick="showEditForm(${book.id}, '${book.title}', '${book.author}', '${book.category}')">✏️ Edytuj</button>
        `;
      list.appendChild(li);
    });
  }


  //formularz edycji ksiazki

  function showEditForm(id, title, author, category) {
    const editSection = document.createElement('div');
    editSection.id = 'editSection_' + id;

    // Lista kategorii
    const categories = [
      "Fantasy", "Science Fiction", "Romans", "Kryminał", "Thriller", "Horror",
      "Literatura piękna", "Literatura faktu", "Literatura polska", "Biografia",
      "Autobiografia", "Poezja", "Esej", "Reportaż", "Dramat", "Komiks", "Dla dzieci",
      "Dla młodzieży", "Przygodowa", "Historyczna", "Religijna", "Filozofia", "Psychologia",
      "Nauka i technika", "Biznes i ekonomia", "Poradnik", "Podróżnicza", "Kulinaria",
      "Sztuka", "Medycyna", "Informatyka", "Utopia", "Dystopia"
    ];

    const categoryOptions = categories.map(cat =>
            `<option value="${cat}" ${cat === category ? 'selected' : ''}>${cat}</option>`
    ).join('');

    editSection.innerHTML = `
        <h3>Edytuj książkę (ID: ${id})</h3>
        <input type="text" id="edit_title_${id}" value="${title}" placeholder="Tytuł"><br>
        <input type="text" id="edit_author_${id}" value="${author}" placeholder="Autor"><br>
        <label for="edit_category_${id}">Kategoria:</label>
        <select id="edit_category_${id}">${categoryOptions}</select><br>
        <input type="file" id="edit_pdf_${id}" accept="application/pdf"><br><br>
        <button onclick="submitEdit(${id})">Zapisz zmiany</button>
        <button onclick="cancelEdit(${id})">Anuluj</button>
        <hr>
    `;

    const list = document.getElementById('book_list');
    list.parentNode.insertBefore(editSection, list.nextSibling);
  }


  // wysylanie zmian po edycji ksiazki

  async function submitEdit(id) {
    const title = document.getElementById(`edit_title_${id}`).value;
    const author = document.getElementById(`edit_author_${id}`).value;
    const category = document.getElementById(`edit_category_${id}`).value;
    const pdfFile = document.getElementById(`edit_pdf_${id}`).files[0];

    const formData = new FormData();
    formData.append('title', title);
    formData.append('author', author);
    formData.append('category', category);
    if (pdfFile) {
      formData.append('pdf', pdfFile);
    }

    try {
      const res = await fetch(`/api/admin/books/${id}`, {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        },
        body: formData
      });

      const data = await res.json();
      alert(data.message || "Zmiany zapisane!");
      loadBooks();
      document.getElementById(`editSection_${id}`).remove();
    } catch (err) {
      console.error(err);
      alert('Błąd podczas edycji książki.');
    }

  }
  // anulowanie edycji ksiazki
  function cancelEdit(id) {
    const editForm = document.getElementById(`editSection_${id}`);
    if (editForm) editForm.remove();
  }

  // dodanie ksiazki
  async function addBook() {
    const title = document.getElementById('book_title').value;
    const author = document.getElementById('book_author').value;
    const content = document.getElementById('book_content').value;
    const category = document.getElementById('book_category').value; // <-- POBIERANIE KATEGORII
    const pdfFile = document.getElementById('book_pdf').files[0];

    const formData = new FormData();
    formData.append('title', title);
    formData.append('author', author);
    formData.append('content', content);
    formData.append('category', category); // <-- DODAJ DO FORMULARZA

    if (pdfFile) {
      formData.append('pdf', pdfFile);
    }

    try {
      const res = await fetch('/api/admin/books/', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        },
        body: formData
      });

      const data = await res.json();
      alert(data.message || "Książka dodana");

      document.getElementById('addBookForm').reset(); // czyścimy formularz
      loadBooks(); // odświeżamy listę książek

    } catch (err) {
      console.error(err);
      alert('Błąd podczas dodawania książki.');
    }
  }

//usuwanie ksiazki

  async function deleteBook(id) {
    if (!confirm("Na pewno usunąć książkę?")) return;

    try {
      const res = await fetch(`/api/admin/books/${id}`, {
        method: 'DELETE',
        headers: {
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        }
      });

      const data = await res.json();
      alert(data.message || "Książka usunięta");
      loadBooks(); // odśwież listę książek
    } catch (err) {
      console.error(err);
      alert('Błąd podczas usuwania książki.');
    }
  }



  // Użytkownicy
  async function loadUsers() {
    const res = await fetch('/api/admin/users', {
      headers
    });

    const users = await res.json();
    const list = document.getElementById('user_list');
    list.innerHTML = '';

    users.forEach(user => {
      const li = document.createElement('li');
      li.innerHTML = `
                    <strong>${user.username}</strong> – ${user.role}
                    <button onclick="deleteUser(${user.id})">🗑️ Usuń</button>
                `;
      list.appendChild(li);
    });
  }

  async function deleteUser(id) {
    if (!confirm("Usunąć użytkownika?")) return;

    const res = await fetch(`/api/admin/users/${id}`, {
      method: 'DELETE',
      headers
    });

    const data = await res.json();
    alert(data.message || "Użytkownik usunięty");
    loadUsers();
  }
  async function createUser() {
    const username = document.getElementById('new_user_username').value.trim();
    const password = document.getElementById('new_user_password').value;
    const confirmPassword = document.getElementById('new_user_confirm_password').value;
    const role = document.getElementById('new_user_role').value;

    if (!username || !password || !confirmPassword) {
      return alert('Wprowadź wszystkie dane.');
    }

    if (password !== confirmPassword) {
      return alert('Hasła nie są takie same!');
    }

    try {
      const res = await fetch('/api/admin/users/create', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token')
        },
        body: JSON.stringify({ username, password, role })
      });

      const data = await res.json();
      alert(data.message);

      // Czyszczenie formularza po sukcesie
      document.getElementById('new_user_username').value = '';
      document.getElementById('new_user_password').value = '';
      document.getElementById('new_user_confirm_password').value = '';
      document.getElementById('new_user_role').value = 'user';

      loadUsers(); // odśwież listę użytkowników
    } catch (err) {
      console.error(err);
      alert('Błąd podczas dodawania użytkownika.');
    }
  }

  document.getElementById('addBookForm').addEventListener('submit', async (e) => {
    e.preventDefault(); // zatrzymaj odświeżanie strony
    await addBook();
  });

  window.addEventListener('DOMContentLoaded', () => {
    checkAdmin();
    loadBooks();
    loadUsers();
  });
</script>
</body>
</html>
